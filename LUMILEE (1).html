if(L.v){const pr=V5.flatMap(a=>V5.map(b=>a+b)),tr=pr.flatMap(p=>V5.map(d=>p+d)),vo=()=>mk(sh(V5),'v'),p2=()=>mk(sh(pr),'q'),p3=()=>mk(sh(tr),'q'),o=['ae','ai','ao','au'];
return L.v=='A1'?[...mk(V5,'v'),...vo(),...vo().slice(0,Math.min(N,15)-10)]:L.v=='A2'?[...mk(o,'q'),...p2().filter(x=>!o.includes(x.t))].slice(0,N):L.v=='A3'?p3().slice(0,N):sh([...vo().slice(0,4),...p2().slice(0,5),...p3()]).slice(0,N)}
const K=L.K,c=L.c,all=K.flatMap(x=>sy(x)),IK=K.filter(x=>INV.includes(x)),IV=IK.flatMap(inv),
wf=(f)=>WORDS.filter(w=>w.c.every(x=>K.includes(x))&&(!f||!c||w.c.includes(c))).map(w=>w.t),
cvv=x=>sy(x).filter(s=>s.length==x.length+1).flatMap(s=>V5.filter(v=>v!=s.slice(-1)).map(v=>s+v)),
ps=n=>{const o=new Set;for(let i=0;i<150&&o.size<n;i++){const a=pick(c?sy(c):all),b=pick(all),t=IV.length&&!R(3)?pick(IV)+b:R(2)?a+b:b+a;if(!WORDS.some(w=>norm(w.t)==t))o.add(t)}return[...o]};
if(L.cu){const T=L.cu,P=[];T.includes('s')&&P.push(mk(sh(all),'s'));T.includes('p')&&P.push(mk(ps(N),'p'));T.includes('w')&&P.push(mk(sh(WORDS.filter(w=>w.c.every(x=>K.includes(x))&&(T.includes('i')||w.d)).map(w=>w.t)),'w'));T.includes('i')&&P.push(mk(sh(IV),'s'));
let o=[],Q=P.map(p=>[...p]);for(let g=0;o.length<N&&g<400;g++){const p=Q[g%Q.length];if(p&&p.length)o.push(p.shift());if(Q.every(p=>!p.length))Q=P.map(p=>sh(p))}return sh(o)}
if(L.kind=='n1'){const O=sy(c),o=O.length,sc=Math.min(o,Math.round((N-o)/2)),r=N-o-sc,cv=cvv(c);
return[...mk(O,'s'),...mk(sh(O).slice(0,sc),'s'),...(cv.length>=3?mk(sh(cv).slice(0,r),'p'):mk(sh(K.filter(x=>x!=c).flatMap(x=>sy(x))).slice(0,r),'s'))]}
if(L.kind=='n2'){const iv=(INV.includes(c)?inv(c):sh(IV)).slice(0,5);let wl=sh(wf(true)).slice(0,5);if(wl.length<3)wl=[...wl,...sh(wf(false).filter(w=>!wl.includes(w))).slice(0,3-wl.length)];
return[...mk(iv,'s'),...mk(wl,'w'),...mk(ps(N-iv.length-wl.length),'p')]}
const s=sh(all).slice(0,c?3:5),f=c?sh(sy(c)).slice(0,3):[],cv=c?sh(cvv(c)).slice(0,2):[],iv=sh(IV).slice(0,3),wl=sh(wf(false)).slice(0,4);
return u(sh([...mk(s,'s'),...mk(f,'s'),...mk(cv,'p'),...mk(iv,'s'),...mk(wl,'w'),...mk(ps(N),'p')])).slice(0,N)}
function go(id){start(lv(id))}
function start(L){clearTimeout(tm);const e=pool(L);if(!e.length)return toast('Con esas letras no hay ejercicios');
S={L,e,i:0,n:0,st:{},pend:[],ok:0,bad:0,rec:0,stars:0,cb:0,cur:null,lk:0};
if(!L.cu&&!LS[L.id])LS[L.id]='p';document.body.classList.remove('end');$('#pn').classList.remove('on');show('play');nxt()}
function nxt(){clearTimeout(tm);let it;S.n++;const cu=(S.cur||{}).t,d=S.pend.findIndex(p=>S.n>=p.d&&p.it.t!=cu);
if(d>=0)it=S.pend[d].it;else if(S.i<S.e.length)it=S.e[S.i++];else if(S.pend.length)it=(S.pend.find(p=>p.it.t!=cu)||S.pend[0]).it;else return end();
S.cur=it;S.st[it.t]=S.st[it.t]||'n';render()}
function end(){S.lk=1;document.body.classList.add('end');lm('cheer');const x=$('#tx');x.style.fontSize='min(11vw,18vh)';
x.innerHTML=[...'¡muy bien!'].map((ch,i)=>`<i class="k${'mbygr'[i%5]}">${ch}</i>`).join('');$('#tag').textContent='';$('#nx').style.display=nextId(S.L.id)?'':'none'}
function render(){S.lk=0;const it=S.cur,t=it.t,tk=toks(t),n=t.length,f=n<3?26:n<5?19:n<7?14:11,x=$('#tx');
paint(t);
$('#tag').textContent=it.y=='p'?'(no es una palabra)':'';$('#st').textContent='⭐ '+S.stars;
const j=it.y=='s'&&tk.length==2;lm(it.y=='v'?'hold':j?'join':'point',j?tk[0]:t,j?tk[1]:'')}
function bien(){if(S.lk)return;S.lk=1;const t=S.cur.t,w=S.st[t];S.ok++;S.cb=0;
if(w=='p'){S.st[t]='r';S.rec++;S.pend=S.pend.filter(p=>p.it.t!=t);S.stars++}else{if(w=='n')S.st[t]='o';if(S.ok%4==0)S.stars++}
$('#st').textContent='⭐ '+S.stars;lm('cheer');tm=setTimeout(nxt,800)}
function mal(){if(S.lk)return;S.lk=1;const it=S.cur;S.bad++;S.cb++;S.st[it.t]='p';S.pend=S.pend.filter(p=>p.it.t!=it.t);S.pend.push({it,d:S.n+3+R(3)});lm('sad');
if(S.cb>=3){S.cb=0;tm=setTimeout(()=>{$('#pl').innerHTML=lumi('cheer');$('#pz').classList.add('on')},1200)}else tm=setTimeout(nxt,1600)}
function panel(){const ready=S.i>=S.e.length&&!S.pend.length,by=s=>Object.keys(S.st).filter(t=>s.includes(S.st[t])).join(' ')||'—';
$('#pb').innerHTML=`<button style="float:left;width:52px;height:52px;border-radius:50%;background:#ffffff26;font-size:26px" onclick=cl()>←</button><h2>${S.L.name}</h2>
<p>Tarjetas ${Math.min(S.i,S.e.length)}/${S.e.length} · ✔ ${S.ok} · ✘ ${S.bad} · pendientes ${S.pend.length} · recuperadas ${S.rec}</p><p>Contenido: ${S.e.map(x=>x.t).join(' ')}</p>
<p>Acertadas: ${by('or')}</p><p>Falladas pendientes: ${S.pend.map(p=>p.it.t).join(' ')||'—'}</p><p>Recuperadas: ${by('r')}</p>
<p><b>Estado: ${S.dom?'dominado (confirmado)':ready?'completo, pendiente de tu confirmación':'en práctica'}</b></p>
<button class=t ${ready?'':'disabled'} onclick=cf()>Confirmar dominio</button><button class=t onclick=ab()>Aa / AA</button>`;$('#pn').classList.add('on')}
const cl=()=>$('#pn').classList.remove('on');
function cf(){S.dom=true;if(!S.L.cu)LS[S.L.id]='m';panel()}
function ab(){document.body.classList.toggle('up');if(!document.body.classList.contains('end'))render();panel()}
function mp(){clearTimeout(tm);S=null;rmap();show('map')}
const st=id=>LS[id]=='m'?'m':LS[id]?'p':'';
function rmap(){let g=`<button class="ct vt ${LS.A4=='m'?'m':ORDER.slice(0,4).some(i=>LS[i])?'p':''}" data-x="V" style="--h:200" onclick="oc('V')">a e i o u</button>`;
CONS.forEach((c,i)=>{const ks=Object.keys(LS).filter(k=>k.startsWith(c+'.'));
g+=`<button class="ct ${LS[c+'.3']=='m'?'m':ks.length?'p':''}" data-x="${c}" style="--h:${i*37}" onclick="oc('${c}')">${c}</button>`;
if(i%3==2||i==24)g+=`<button class="ct r ${st('R'+i)}" data-x="R${i}" onclick="oc('R${i}')">★</button>`});
$('#cg').innerHTML=g;oc(sel)}
function oc(x){sel=x;document.querySelectorAll('#cg .ct').forEach(b=>b.classList.toggle('sel',b.dataset.x==x));
if(!x){$('#sh').textContent='';$('#sb').innerHTML='';return}
const ids=x=='V'?['A1','A2','A3','A4']:/^R\d/.test(x)?[x]:[1,2,3].map(k=>x+'.'+k);
$('#sh').textContent=x=='V'?'Vocales':/^R\d/.test(x)?'Repaso acumulativo':'Consonante '+x;
$('#sb').innerHTML=ids.map(id=>`<button class="lb ${st(id)}" onclick="go('${id}')">${lv(id).name}<small>${lv(id).d}</small></button>`).join('')}
let rcd=0;
function rc(){if(rcd)return;rcd=1;$('#cc').innerHTML=CONS.map((c,i)=>`<button class=ct style="--h:${i*37}" data-c="${c}" onclick="this.classList.toggle('sel')">${c}</button>`).join('');
$('#ty').innerHTML=[['s','Sílabas',1],['p','Secuencias',0],['w','Palabras reales',1],['i','Sílabas inversas',0]].map(([k,n,o])=>`<button class="lb ${o?'p sel':''}" data-k="${k}" onclick="this.classList.toggle('sel');this.classList.toggle('p')">${n}</button>`).join('')}
function sc(){const K=[...document.querySelectorAll('#cc .sel')].map(b=>b.dataset.c).sort((a,b)=>CONS.indexOf(a)-CONS.indexOf(b)),T=[...document.querySelectorAll('#ty .sel')].map(b=>b.dataset.k);
if(!K.length)return toast('Elige al menos una consonante');if(!T.length)return toast('Elige un tipo de ejercicio');

$('#hl').innerHTML=lumi('wave');
</script></body></html>
